# Standalone catsteamtxtmode supervisor defaults.
# Set launch_missing=1 and fill in steam_command/tf2_command to launch children
# through the preload. Existing processes are watched but cannot be retroactively
# injected after they started.
poll_interval_ms=1000
log_processes=1
launch_missing=0
stop_children=0
textmode=1
synthetic_hardware=1
hide_windows=1
drop_draws=1
trim_webhelper=0
frame_interval_us=100000
randomize_hardware=1
hardware_seed=
steam_preload=
tf2_preload=
steam_command=
tf2_command=
steam_names=steam,steamwebhelper,gameoverlayui
tf2_names=tf_linux64,tf_linux,hl2_linux
